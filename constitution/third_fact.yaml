      description: "Formal verification of code adherence"
      
    safety:
      weight: 0.22
      check: "Policy.compliant(action)"
      description: "AEGIS-Λ Zero-Trust enforcement"
      
    user_benefit:
      weight: 0.14
      check: "ΔUtility > 0"
      description: "Proof-of-Impact receipt verification"
      
    efficiency:
      weight: 0.12
      check: "Work/Energy > θ"
      description: "Amānah-based bloat penalty"
      
    auditability:
      weight: 0.12
      check: "∃Hash(receipt)"
      description: "No Black Box actions allowed"
      
    anti_centralization:
      weight: 0.08
      check: "ΔGini ≤ 0"
      description: "Whale dominance prevention"
      
    robustness:
      weight: 0.06
      check: "min(ProbeSuccessRate) = 0"
      description: "SAPE probe resistance"
      
    adl_fairness:
      weight: 0.04
      check: "Bias(output) < ε"
      description: "Algorithmic fairness across demographics"

