name: BIZRA Elite CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    build:
        name: Build & Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Lint with Clippy
              run: cargo clippy --all-targets --features all-safe -- -D warnings

            - name: Build
              run: cargo build --all-targets

            - name: Run tests
              run: cargo test --features all-safe

    attestation:
        name: SNR Attestation Gate
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Run Peak Masterpiece Attestation
              run: ./scripts/peak_masterpiece.sh

            - name: Verify Attestation
              run: python3 scripts/verify_attestation.py

            - name: Upload Certification
              uses: actions/upload-artifact@v4
              with:
                  name: snr-certification
                  path: certifications/
                  retention-days: 90

    security:
        name: Security Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install cargo-audit
              run: cargo install cargo-audit

            - name: Run security audit
              run: cargo audit
              continue-on-error: true
