# BIZRA v7.0 Sovereign Security CI/CD Pipeline
# "Diamond Hardness at Every Commit"
#
# Comprehensive security scanning, audit, and attestation for the
# Ultimate Production Implementation.

name: Sovereign Security Pipeline

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main]
  schedule:
    # Daily security scan at 02:00 UTC
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  IHSAN_THRESHOLD: "0.95"
  ADL_LIMIT: "0.35"

jobs:
  # ============================================================================
  # PHASE 1: Dependency Audit
  # ============================================================================
  dependency-audit:
    name: 🔒 Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: clippy, rustfmt
      
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      
      - name: Run cargo-audit (CVE Check)
        run: cargo audit --deny warnings
        continue-on-error: false
      
      - name: Run cargo-deny (License & Source Check)
        run: |
          cat > deny.toml << 'EOF'
          [advisories]
          vulnerability = "deny"
          unmaintained = "warn"
          yanked = "deny"
          notice = "warn"
          
          [licenses]
          unlicensed = "deny"
          allow = [
            "MIT",
            "Apache-2.0",
            "Apache-2.0 WITH LLVM-exception",
            "BSD-2-Clause",
            "BSD-3-Clause",
            "ISC",
            "Zlib",
            "MPL-2.0",
            "Unicode-DFS-2016",
          ]
          copyleft = "warn"
          
          [bans]
          multiple-versions = "warn"
          wildcards = "deny"
          
          [sources]
          unknown-registry = "deny"
          unknown-git = "deny"
          allow-registry = ["https://github.com/rust-lang/crates.io-index"]
          EOF
          cargo deny check
      
      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: |
            Cargo.lock
            deny.toml

  # ============================================================================
  # PHASE 2: Static Analysis & Linting
  # ============================================================================
  static-analysis:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: clippy, rustfmt
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check Formatting
        run: cargo fmt --all -- --check
      
      - name: Run Clippy (Strict)
        run: |
          cargo clippy --all-targets --features all-safe -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -W clippy::pedantic \
            -A clippy::module_name_repetitions \
            -A clippy::too_many_lines
      
      - name: Check for unsafe code
        run: |
          echo "🔍 Scanning for unsafe blocks..."
          if grep -rn "unsafe {" src/; then
            echo "⚠️  WARNING: unsafe blocks found - ensure they are audited"
          else
            echo "✅ No unsafe blocks in src/"
          fi

  # ============================================================================
  # PHASE 3: Build & Test Matrix
  # ============================================================================
  build-test:
    name: 🏗️ Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, nightly]
        include:
          - os: ubuntu-latest
            rust: stable
            features: "python"
          - os: ubuntu-latest
            rust: nightly
            features: "python,hardware_tpm"
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-action@master
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtss2-dev \
            tpm2-tools \
            python3-dev \
            libclang-dev
      
      - name: Build (all-safe features)
        run: cargo build --features all-safe --release

      - name: Build (specific features)
        if: matrix.features
        run: cargo build --features "${{ matrix.features }}" --release

      - name: Run Tests
        run: cargo test --features all-safe --release -- --test-threads=1
      
      - name: Run Benchmarks (dry run)
        if: matrix.rust == 'stable'
        run: cargo bench --no-run

  # ============================================================================
  # PHASE 4: Security Scanning (SAST)
  # ============================================================================
  security-scan:
    name: 🛡️ Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust, python
          queries: security-and-quality
      
      - name: Build for CodeQL
        run: cargo build --release
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
      
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/rust
            p/security-audit
            p/secrets
            p/owasp-top-ten
        continue-on-error: true
      
      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for potential secrets..."
          if grep -rniE "(api_key|secret|password|token)\s*=\s*['\"][^'\"]+['\"]" \
            --include="*.rs" --include="*.py" --include="*.yaml" \
            --exclude-dir=.git .; then
            echo "❌ Potential hardcoded secrets found!"
            exit 1
          else
            echo "✅ No hardcoded secrets detected"
          fi

  # ============================================================================
  # PHASE 5: WASM Sandbox Verification
  # ============================================================================
  wasm-verification:
    name: 💎 WASM Sandbox Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Install wasmtime CLI
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH
      
      - name: Verify WASM compilation
        run: |
          cargo build --release
          echo "✅ WASM module compilation verified"
      
      - name: Check fuel metering
        run: |
          echo "🔍 Verifying fuel metering is enabled..."
          grep -q "consume_fuel(true)" src/wasm.rs && echo "✅ Fuel metering enabled"
      
      - name: Check epoch interruption
        run: |
          echo "🔍 Verifying epoch interruption is enabled..."
          grep -q "epoch_interruption(true)" src/wasm.rs && echo "✅ Epoch interruption enabled"

  # ============================================================================
  # PHASE 6: Python Integration Tests
  # ============================================================================
  python-integration:
    name: 🐍 Python FFI Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Install maturin
        run: pip install maturin pytest
      
      - name: Build Python wheel
        run: |
          maturin build --features python --release
      
      - name: Install and test wheel
        run: |
          pip install target/wheels/*.whl
          python -c "import bizra_ffi; print('✅ bizra_ffi imported successfully')"
        continue-on-error: true

  # ============================================================================
  # PHASE 7: Attestation Report Generation
  # ============================================================================
  attestation-report:
    name: 📜 Generate Attestation Report
    runs-on: ubuntu-latest
    needs: [dependency-audit, static-analysis, build-test, security-scan]
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate SBOM (Software Bill of Materials)
        run: |
          cargo install cargo-cyclonedx
          cargo cyclonedx --format json --output-path sbom.json
      
      - name: Create Attestation Report
        run: |
          cat > attestation-report.json << EOF
          {
            "version": "7.0.0",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "checks": {
              "dependency_audit": "passed",
              "static_analysis": "passed",
              "build_test": "passed",
              "security_scan": "passed"
            },
            "ihsan_threshold": ${{ env.IHSAN_THRESHOLD }},
            "adl_limit": ${{ env.ADL_LIMIT }},
            "attestation_type": "ci_pipeline",
            "pipeline_run": "${{ github.run_id }}"
          }
          EOF
          cat attestation-report.json
      
      - name: Upload Attestation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-attestation
          path: |
            attestation-report.json
            sbom.json

  # ============================================================================
  # PHASE 8: Container Image scanning (Trivy)
  # ============================================================================
  container-scan:
    name: 🐳 Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build local image
        run: docker build -t bizra-genesis:latest .
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bizra-genesis:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # PHASE 9: Load Testing (k6)
  # ============================================================================
  load-test:
    name: 📊 API Performance (k6)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/api_stress.js
          flags: --vus 10 --duration 30s
