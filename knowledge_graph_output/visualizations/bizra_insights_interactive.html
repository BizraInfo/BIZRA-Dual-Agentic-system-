ae021b41", "target": "doc:e8a64cc3616e05f3", "type": "PART_OF"}, {"source": "insight:6645da4b8ff3a5b5", "target": "doc:e8a64cc3616e05f3", "type": "PART_OF"}, {"source": "insight:bd3320d261ab828c", "target": "doc:e8a64cc3616e05f3", "type": "PART_OF"}, {"source": "insight:56a333b9f4f2550a", "target": "doc:e8a64cc3616e05f3", "type": "PART_OF"}, {"source": "insight:d94f0d688195913d", "target": "doc:60876efa8d0e5c3b", "type": "PART_OF"}, {"source": "insight:a037a0bcb617658f", "target": "doc:60876efa8d0e5c3b", "type": "PART_OF"}, {"source": "insight:263e79a1d34a372b", "target": "doc:60876efa8d0e5c3b", "type": "PART_OF"}, {"source": "insight:57623d5debbe16a0", "target": "doc:60876efa8d0e5c3b", "type": "PART_OF"}];

        const width = window.innerWidth;
        const height = window.innerHeight - 150;

        const svg = d3.select("#visualization")
            .attr("width", width)
            .attr("height", height);

        const tooltip = d3.select("#tooltip");

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-200))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(20));

        const link = svg.append("g")
            .selectAll("line")
            .data(links)
            .join("line")
            .attr("class", "link");

        const node = svg.append("g")
            .selectAll("circle")
            .data(nodes)
            .join("circle")
            .attr("class", d => `node ${d.category}`)
            .attr("r", d => 5 + (d.confidence * 5))
            .call(drag(simulation))
            .on("mouseover", function(event, d) {
                tooltip.style("display", "block")
                    .html(`
                        <div class="tooltip-title">${d.title}</div>
                        <div class="tooltip-category">${d.category}</div>
                        <div>${d.labels.join(", ")}</div>
                        <div style="margin-top:5px;font-size:10px">Confidence: ${(d.confidence * 100).toFixed(0)}%</div>
                    `)
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 10) + "px");
                d3.select(this).attr("r", d => 8 + (d.confidence * 7));
            })
            .on("mouseout", function(event, d) {
                tooltip.style("display", "none");
                d3.select(this).attr("r", d => 5 + (d.confidence * 5));
            });

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
        });

        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }

            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }
    </script>
