[package]
name = "bizra-node0"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "bizra-node0"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"

ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"

argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
