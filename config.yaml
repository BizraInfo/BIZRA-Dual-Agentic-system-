node_id: "bizra-genesis-server-0"

# Production services
services:
  dual_agentic:
    port: 9091
    host: "127.0.0.1"
  mcp_bridge:
    port: 8443
    host: "0.0.0.0"
    tls: true
  
memory:
  type: "Redis"
  url: "redis://synapse:6379"
  prefix: "bizra:context"

# Data Lake (Windows via WSL mount)
data_lake:
  path: "/mnt/c/BIZRA-DATA-LAKE"
  nodes_file: "graph_nodes.json"
  edges_file: "graph_edges.json"
  ledger_file: "gold_ledger.jsonl"

agents:
  - name: "default"
    model:
      type: "LMStudio"
      name: "qwen2.5-0.5b-instruct"
      model: "qwen2.5-0.5b-instruct"
      base_url: "http://192.168.56.1:1234"
      options:
        temperature: 0.7
  - name: "echo-agent"
    model:
      type: "Echo"
      id: "echo-fallback"
