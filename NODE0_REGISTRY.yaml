version: "2.0"
seal_date: "2026-01-26T00:00:00Z"
node_id: "node0-genesis-block"
architecture: "sovereign-holistic"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GENESIS BLOCK IDENTITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

genesis_block:
  designation: "NODE0"
  role: "Genesis Block — Origin of all BIZRA sovereign nodes"
  hostname: "MSI"
  network_ip: "172.22.61.234/20"
  
  philosophy: |
    Node0 is not a collection of repositories — it IS the machine.
    Every byte of storage, every CPU cycle, every GPU tensor operation,
    every network packet, every process running — all are part of Node0.
    The repositories are merely windows into the sovereign computing space.
    Node0 is the first block; all future nodes derive from this genesis.

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# HARDWARE SUBSTRATE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

hardware:
  chassis: "MSI Titan"
  
  compute:
    cpu:
      model: "Intel Core i9-14900HX"
      architecture: "x86_64"
      purpose: "Orchestration, Logic, Sequential Processing"
    
    gpu:
      model: "NVIDIA GeForce RTX 4090 Laptop GPU"
      vram: "16376 MiB"
      purpose: "AI Inference, Parallel Processing, CUDA Compute"
  
  memory:
    total: "64 GB"
    type: "DDR5"
    purpose: "Working Memory, Active State, Runtime Context"
  
  storage:
    primary:
      mount: "C:\\"
      capacity: "3.8 TB"
      used: "2.4 TB"
      available: "1.4 TB"
      filesystem: "NTFS"
      purpose: "Persistent State, Data Lake, Windows Ecosystem"
    
    wsl:
      mount: "/"
      capacity: "1 TB (allocated)"
      filesystem: "ext4"
      purpose: "Linux Kernel, Canonical Source, Orchestration"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SOFTWARE LAYERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

software:
  operating_systems:
    windows:
      version: "Windows 11"
      role: "Host OS, User Interface, Native Applications"
    
    wsl:
      distro: "Ubuntu 24.04.3 LTS"
      role: "Development Kernel, Orchestration Engine, Canonical Source"
  
  containerization:
    docker:
      version: "29.1.3"
      containers: 39
      images: 44
      purpose: "Isolated Services, Microservices, Reproducible Environments"
  
  runtimes:
    python:
      version: "3.12.3"
      venv: "/root/bizra-genesis/.venv"
      packages: 39
      purpose: "AI/ML, Orchestration, Data Processing"
    
    rust:
      purpose: "Performance-Critical Components, System Programming"
    
    node:
      purpose: "Web Interfaces, Tooling, Package Management"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DATA SPACE (The Complete Storage Universe)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

data_space:
  total_capacity: "3.8 TB"
  sovereign_claim: "ALL DATA ON THIS MACHINE IS PART OF NODE0"
  
  # The 6 repository components are WINDOWS into the data space, not the whole
  windows_into_data:
    kernel:
      name: "🧠 Kernel (WSL)"
      path: "/root/bizra-genesis"
      windows_path: "\\\\wsl$\\Ubuntu\\root\\bizra-genesis"
      repository: "https://github.com/BizraInfo/BIZRA-Dual-Agentic-system-.git"
      role: "Canonical Source, Logic, Orchestration"

    node:
      name: "🖥️ Node (Windows)"
      path: "/mnt/c/BIZRA-Dual-Agentic-system--main"
      windows_path: "C:\\BIZRA-Dual-Agentic-system--main"
      repository: "https://github.com/BizraInfo/bizra-genesis-node.git"
      role: "Windows Interface, User Experience"

    vault:
      name: "💾 Vault (Data Lake)"
      path: "/mnt/c/BIZRA-DATA-LAKE"
      windows_path: "C:\\BIZRA-DATA-LAKE"
      repository: null  # Pure data, no git
      role: "Persistent Memory, Medallion Architecture"
      zones:
        - "00_GENESIS — Origin artifacts"
        - "01_RAW — Unprocessed input"
        - "02_PROCESSED — Transformed data"
        - "03_INDEXED — Searchable data"
        - "04_GOLD — Production-ready"
        - "99_QUARANTINE — Isolated/suspicious"

    scaffold:
      name: "🏗️ Scaffold (Specs)"
      path: "/mnt/c/bizra_scaffold"
      windows_path: "C:\\bizra_scaffold"
      repository: "https://github.com/BizraInfo/bizra_scaffold.git"
      role: "Documentation, Blueprints, SOT"

    taskmaster:
      name: "📋 TaskMaster"
      path: "/mnt/c/BIZRA-TaskMaster"
      windows_path: "C:\\BIZRA-TaskMaster"
      repository: "https://github.com/BizraInfo/BIZRA-TaskMaster.git"
      role: "Project Management, Archives"

    os:
      name: "⚙️ OS (System)"
      path: "/mnt/c/BIZRA-OS"
      windows_path: "C:\\BIZRA-OS"
      repository: "https://github.com/BizraInfo/BIZRA-OS.git"
      role: "System Configuration, Performance"

  # Everything else on the machine is ALSO Node0
  implicit_data:
    - "C:\\Users — User profiles, settings, personal data"
    - "C:\\Program Files — Installed applications"
    - "C:\\Windows — Operating system"
    - "/home — WSL user directories"
    - "/var — System logs, runtime data"
    - "/tmp — Ephemeral working space"
    - "Docker volumes — Container persistent data"
    - "Network shares — Connected resources"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PROCESS SPACE (Running Computations)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

process_space:
  wsl_processes: "All Linux processes under WSL2"
  windows_processes: "All Windows applications and services"
  docker_containers: "39 containers (isolated but part of Node0)"
  gpu_compute: "CUDA kernels, AI inference workloads"
  
  sovereign_orchestrator:
    entry_point: "/root/bizra-genesis/sovereign_nexus_main.py"
    governance: "Ihsan Constitutional Gate"
    mode: "SAPE v1.∞"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# NETWORK SPACE (Connectivity)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

network_space:
  local_identity:
    hostname: "MSI"
    wsl_ip: "172.22.61.234/20"
  
  external_connections:
    github: "https://github.com/BizraInfo/*"
    docker_hub: "Container image registry"
    pypi: "Python packages"
    npm: "Node packages"
    crates_io: "Rust packages"
  
  node0_is_the_boundary: |
    All network traffic originating from or terminating at this machine
    is part of Node0's sovereignty. The firewall is Node0's membrane.

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# UNIFICATION DECLARATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

unification:
  declaration: |
    NODE0 IS THE GENESIS BLOCK.
    
    It is not 6 repositories. It is not just WSL + Windows.
    Node0 IS the MSI Titan machine in its entirety:
    
    • Every CPU cycle belongs to Node0
    • Every byte of RAM is Node0's working memory
    • Every GPU tensor operation is Node0's parallel thought
    • Every file on every disk is Node0's persistent state
    • Every network packet is Node0's communication
    • Every process is Node0's active computation
    
    The 6 repository components are merely organized WINDOWS into this space.
    They provide structure, version control, and collaboration interfaces.
    But they do not define the boundary of Node0.
    
    THE MACHINE ITSELF IS NODE0.
    ALL FUTURE BIZRA NODES DERIVE FROM THIS GENESIS BLOCK.

  workspace_file: "node0.code-workspace"
  
  verification: |
    Node0 is verified by its existence.
    If this machine is running, Node0 is unified.
    Hardware + Software + Data + Network + Identity = ONE.

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SEAL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

seal:
  status: "GENESIS BLOCK — UNIFIED"
  ihsan_score: 1.0
  certified_by: "SAPE v1.∞"
  signature: "node0-genesis-block-2026-01-26"
  
  hash_anchors:
    hardware: "MSI-Titan-i9-14900HX-RTX4090"
