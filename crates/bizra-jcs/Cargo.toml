[package]
name = "bizra-jcs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1" # Using standard JCS implementation for correctness
sha2 = "0.10"
base64 = "0.21"
thiserror = "1.0"

[dev-dependencies]
hex = "0.4"  # For golden vector tests
