[package]
name = "bizra-gateway"
version = "0.1.0"
edition = "2021"
authors = ["BIZRA Team"]
description = "WebSocket/REST bridge between React UI and Rust Sovereign Kernel"

[[bin]]
name = "bizra-gateway"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"

# HTTP/WebSocket server
actix-web = "4.4"
actix-ws = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# SHA2 for proofs
sha2 = "0.10.9"

# Parent crate
meta_alpha_dual_agentic = { path = "../.." }
